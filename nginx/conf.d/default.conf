server {
    listen 80;
    server_name joeyfox.dev; # Adjust to your actual domain

    # 1. Serve the React Frontend (Mapped via Docker Volume)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. The Bridge to your Spring Boot Backend
    location /api/ {
        # 'backend' matches the service name in your docker-compose.yml
        proxy_pass http://backend:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Useful for Spring Boot Auth/Sessions
        proxy_cookie_path / "/; HttpOnly; Secure"; 
    }
}
