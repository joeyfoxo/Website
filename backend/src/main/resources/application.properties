spring.application.name=WebBackend
spring.datasource.url=jdbc:postgresql://db:5432/portfolio_db
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Prints the specific filter that denies the request
logging.level.org.springframework.security=DEBUG

# Prints the SQL queries if your UserDetailsService is failing to find the user
logging.level.org.hibernate.SQL=DEBUG

# (Optional) See the exact data being passed into your UserDetailsService
logging.level.dev.joeyfoxo.webbackend=DEBUG

# Tells Spring to trust the headers sent by your Nginx proxy
server.forward-headers-strategy=framework

# Optional: specifically ensures redirects and cookies use the correct protocol
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto