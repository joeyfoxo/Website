spring.application.name=WebBackend
spring.datasource.url=jdbc:postgresql://db:5432/portfolio_db
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Prints the specific filter that denies the request
logging.level.org.springframework.security=TRACE

# Prints the SQL queries if your UserDetailsService is failing to find the user
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG

# Tells Spring to trust the headers sent by your Nginx proxy
server.forward-headers-strategy=native

# Optional: specifically ensures redirects and cookies use the correct protocol
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Force cookies to be sent over HTTP for local development
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

# Force the cookie to the root path so the React app and API share it natively
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax