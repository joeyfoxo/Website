services:
  # The Database: Creates an isolated PostgreSQL instance for local development
  db:
    image: postgres:15
    container_name: portfolio-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: portfolio_db
      # DB_USER and DB_PASSWORD are pulled from your local .env file
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Persists data to your local machine so it survives container restarts
      - postgres_data:/var/lib/postgresql/data

  # The Backend: The Spring Boot API that connects to the 'db' service
  backend:
    build: ./backend
    container_name: portfolio-api
    restart: always
    environment:
      # Tells Spring how to connect to the 'db' container
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      # Ensures the database is ready before starting the backend
      - db

  # The Frontend: Serves your React app via Nginx
  nginx:
    build: ./frontend
    container_name: portfolio-nginx
    restart: always
    ports:
      # Maps local machine port 8081 to the container's port 80
      - "80:80"
    volumes:
      # Syncs your custom Nginx configuration file to the server
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend

# Persistent storage definition
volumes:
  postgres_data: