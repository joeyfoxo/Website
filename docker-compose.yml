version: '3.8'

services:
  # The Database: Creates an isolated PostgreSQL instance for local development
  db:
    image: postgres:15
    container_name: portfolio-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # The Backend: The Spring Boot API that connects to the 'db' service
  backend:
    build: ./backend
    container_name: portfolio-api
    restart: always
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    volumes:
      # ALIGNED: Fixed spacing to ensure standard YAML parsing
      - "./FileStorage:/app/storage"
    depends_on:
      - db

  # The Frontend: Serves your React app via Nginx
  nginx:
    build: ./frontend
    container_name: portfolio-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # MATCHED PATH: Optional read-only bridge matching your exact path
      - "./FileStorage:/app/storage:ro"
    depends_on:
      - backend

# Persistent storage definition
volumes:
  postgres_data: